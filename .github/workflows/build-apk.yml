name: 打包安卓 APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev

      - name: 安装 Buildozer
        run: |
          pip install --upgrade pip wheel
          pip install buildozer cython==0.29.33
          buildozer --version

      # 预装 Buildozer 期望布局的 SDK（tools/bin/sdkmanager）+ 许可指纹 + 基础组件，
      # 使 buildozer 识别为"SDK 已存在"后能直接用，且不会再触发交互式许可确认
      - name: 预装 Android SDK 并接受许可
        run: |
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/licenses
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d /tmp/clt
          mv /tmp/clt/cmdline-tools $SDK/tools
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > $SDK/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c9136d617a0\n" > $SDK/licenses/android-sdk-preview-license
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          yes | $SDK/tools/bin/sdkmanager --sdk_root=$SDK "platform-tools" "platforms;android-33" "build-tools;34.0.0"

      - name: 打包 APK（首次约 20~40 分钟）
        run: buildozer -v android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: jiakao-apk
          path: bin/*.apk
          if-no-files-found: error
