name: 打包安卓 APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev

      - name: 安装 Buildozer
        run: |
          pip install --upgrade pip wheel
          pip install buildozer cython==0.29.33
          buildozer --version

      # 许可协议由 buildozer.spec 中的 android.accept_license = 1 自动接受
      # 注意：不要预创建 ~/.buildozer/android/platform/android-sdk 目录，
      # 否则 buildozer 会误判 SDK 已安装而跳过下载

      - name: 打包 APK（首次约 20~40 分钟）
        run: buildozer -v android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: jiakao-apk
          path: bin/*.apk
          if-no-files-found: error
